version: '3.9'

services:
  gateway:
    build:
      context: .
      target: production
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/silver_gateway
      REDIS_URL: redis://redis:6379
    ports:
      - '3000:3000'
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo-data:/data/db
    ports:
      - '27017:27017'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports:
      - '6379:6379'

volumes:
  mongo-data:
  redis-data:
